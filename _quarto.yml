project:
  type: website
  post-render:
    - helpers/convert_qmd_to_md.py
    - helpers/export_marimo.py
  render:
    - index.qmd
    - 404.qmd
    - general/*.qmd
    - lectures/*.qmd
    - tutorials/*.qmd

website:
  favicon: images/favicon.svg
  title: "Programming with Python"
  repo-url: https://github.com/beyondsimulations/Introduction-to-Python
  site-url: https://python.tobiasvlcek.com
  repo-actions: [source, issue]
  bread-crumbs: true
  sidebar:
    style: floating
    logo: images/course-logo.svg
    logo-alt: "Programming with Python"
    collapse-level: 1
    search: true
    contents:
      - text: "Welcome"
        href: index.qmd
      - text: "Syllabus"
        href: general/syllabus.qmd
      - text: "***"
      - section: "01 Introduction "
        contents:
          - text: "Lecture"
            href: lectures/lec_01_introduction.qmd
          - text: "Tutorial"
            href: tutorials/tut_01_introduction.qmd
      - section: "02 Control Flow"
        contents:
          - text: "Lecture"
            href: lectures/lec_02_control.qmd
          - text: "Tutorial"
            href: tutorials/tut_02_control.qmd
      - section: "03 Functions"
        contents:
          - text: "Lecture"
            href: lectures/lec_03_functions.qmd
          - text: "Tutorial"
            href: tutorials/tut_03_functions.qmd
      - section: "04 Dimensions"
        contents:
          - text: "Lecture"
            href: lectures/lec_04_dimensions.qmd
          - text: "Tutorial"
            href: tutorials/tut_04_dimensions.qmd
      - section: "05 Errors"
        contents:
          - text: "Lecture"
            href: lectures/lec_05_errors.qmd
          - text: "Tutorial"
            href: tutorials/tut_05_errors.qmd
      - section: "06 Modules"
        contents:
          - text: "Lecture"
            href: lectures/lec_06_modules.qmd
          - text: "Tutorial"
            href: tutorials/tut_06_modules.qmd
      - section: "07 Scientific Computing"
        contents:
          - text: "Lecture"
            href: lectures/lec_07_scientific.qmd
          - text: "Tutorial"
            href: tutorials/tut_07_scientific.qmd
      - section: "08 Pandas and AI"
        contents:
          - text: "Lecture"
            href: lectures/lec_08_pandas.qmd
          - text: "Tutorial"
            href: tutorials/tut_08_pandas.qmd
      - section: "09 Plotting"
        contents:
          - text: "Lecture"
            href: lectures/lec_09_plotting.qmd
          - text: "Tutorial"
            href: tutorials/tut_09_plotting.qmd
      - section: "10 Projects"
