        href: general/literature.qmd
  page-footer:
    center: "Programming with Python, Tobias Vlćek</br>CC BY-NC-SA 4.0"
    left:
      - icon: github
        href: https://github.com/beyondsimulations/Introduction-to-Python
      - icon: linkedin
        href: https://linkedin.com/in/tobiasvlcek
      - icon: envelope
        href: mailto:vlcek@beyondsimulations.com
      - icon: skip-backward
        href: https://tobiasvlcek.com/lectures/
      - icon: shield-check
        href: general/privacy.qmd
      - icon: file-text
        href: general/imprint.qmd
format:
  html:
    theme:
      - default
      - styles.scss
      - brand
    toc: true
    highlight-style: github
    callout-appearance: simple
    code-copy: true
    code-link: true
    toc-location: right
    code-overflow: wrap
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    include-in-header:
      - general/header.html
      - general/favicon.html
    include-after-body:
      text: |
        <script defer src="https://oshu.eu/widget.js"></script>
        <script>
          document.addEventListener('DOMContentLoaded', function () {
            ChatWidget.init({
              tenant: "platform",
              agent: "introduction-python",
              layoutMode: "sidebar",
            });
          });
        </script>

  hugo-md: default

  typst:
    papersize: a4

format-links:
  - html
  - format: typst
    text: PDF
    icon: file-pdf

execute:
  freeze: auto

brand: _brand.yml
