format:
  html: default
  typst: default
  revealjs:
    include-in-header:
      - ../general/mathjax.html
    theme:
      - default
      - ../styles.scss
      - brand
    transition: slide
    transition-speed: fast
    highlight-style: github
    callout-appearance: simple
    # One stage for every course: 16:9 (Lecture-Foundations, research/slide-sizes.md).
    width: 1280
    height: 720
    slide-number: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    preview-links: auto

format-links:
  - html
  - revealjs
  - format: typst
    text: PDF
    icon: file-pdf

execute:
  echo: true
